[project]
name = "starchive-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pgvector",
    "pyjwt",
    "bcrypt",
    "httpx",
    "openai",
    "pydantic-settings",
    "pydantic[email]>=2.13.4",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "alembic"]
etl = ["pandas", "tenacity"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/**/*router.py" = ["B008"]
"app/core/deps.py" = ["B008"]
# Vercel 진입점
"api/index.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "db: 실제 DB 연결이 필요한 테스트",
    "external: 외부 API 호출이 필요한 테스트",
]

