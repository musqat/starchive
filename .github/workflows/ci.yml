name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 설정을 import 시점에 읽는다. DB 를 안 쓰는 테스트도 값이 있어야 뜬다
    env:
      DATABASE_URL: postgresql+psycopg://x:x@localhost:5432/x
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      # DB·외부 API 없이 도는 것만
      - name: 테스트
        run: uv run pytest -q -m "not db and not external"

      # Vercel 은 [project].dependencies 만 설치한다.
      # app/ 이 dev·etl 그룹 패키지를 쓰면 여기서 걸린다
      - name: 배포 의존성
        run: uv run --no-dev --no-group etl python -c "from app.main import app"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # LayoutProps 같은 라우트 타입을 next 가 빌드 때 만든다.
      # 빌드를 건너뛰면 tsc 가 그 타입을 못 찾는다
      - name: 빌드
        run: npm run build
        env:
          BACKEND_ORIGIN: http://localhost:8000

      - run: npm run typecheck

      - run: npm run lint
