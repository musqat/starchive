name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # 빈 DB. 마이그레이션만 올리고 작품 데이터는 없음
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: starchive
          POSTGRES_PASSWORD: starchive
          POSTGRES_DB: starchive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starchive"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://starchive:starchive@localhost:5432/starchive
      DIRECT_URL: postgresql+psycopg://starchive:starchive@localhost:5432/starchive
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: uv sync --all-groups

      - name: 린트
        run: uv run ruff check .

      - name: 마이그레이션
        run: uv run alembic upgrade head

      # 작품 데이터·외부 API 가 필요한 것만 뺌
      - name: 테스트
        run: uv run pytest -q -m "not catalog and not external"

      # Vercel 은 [project].dependencies 만 설치한다.
      # app/ 이 dev·etl 그룹 패키지를 쓰면 여기서 걸린다
      - name: 배포 의존성
        run: uv run --no-dev --no-group etl python -c "from app.main import app"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # LayoutProps 같은 라우트 타입을 next 가 빌드 때 만든다.
      # 빌드를 건너뛰면 tsc 가 그 타입을 못 찾는다
      - name: 빌드
        run: npm run build
        env:
          BACKEND_ORIGIN: http://localhost:8000

      - run: npm run typecheck

      - run: npm run lint

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - name: 린트
        run: flutter analyze

      # APK 빌드는 안 돌린다. Android SDK 를 받는 데 몇 분이 걸리고,
      # 지금 잡히는 것은 analyze 가 이미 잡는다
      - name: 테스트
        run: flutter test
