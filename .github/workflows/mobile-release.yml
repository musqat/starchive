name: APK 릴리스

# mobile-v1.0.0 처럼 태그를 밀면 돈다. 손으로도 돌릴 수 있다
on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      # 키스토어는 저장소에 두지 않는다. 비밀값에서 꺼내 빌드 때만 만든다
      - name: 서명 키 준비
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/starchive.jks
          cat > android/key.properties <<EOF
          storeFile=starchive.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 기본값은 에뮬레이터용 10.0.2.2 라 배포본에는 못 쓴다
      - name: APK 빌드
        run: flutter build apk --release --dart-define=API_BASE_URL=https://starchive-psi.vercel.app

      # 태그로 돌아온 것만 올린다. 손으로 돌린 것은 빌드만 확인한다
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" build/app/outputs/flutter-apk/app-release.apk --title "$GITHUB_REF_NAME" --notes "안드로이드 설치 파일. 스토어를 거치지 않아 설치할 때 출처 확인이 한 번 뜬다"

      - name: 키 지우기
        if: always()
        run: rm -f android/starchive.jks android/key.properties
        env:
          GH_TOKEN: ${{ github.token }}
